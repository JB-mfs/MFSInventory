<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MFS Inventory System</title>
    <style>
        :root {
            --primary-color: #2563eb;
            --primary-hover: #1d4ed8;
            --bg-color: #f8fafc;
            --card-bg: #ffffff;
            --text-color: #1e293b;
            --border-color: #cbd5e1;
            --error-color: #ef4444;
        }
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
        }
        body {
            background-color: var(--bg-color);
            color: var(--text-color);
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
        }
        .container {
            width: 100%;
            max-width: 400px;
            padding: 2rem;
            background-color: var(--card-bg);
            border-radius: 12px;
            box-shadow: 0 4px 6px -1px rgb(0 0 0 / 0.1), 0 2px 4px -2px rgb(0 0 0 / 0.1);
        }
        /* View States */
        .view {
            display: none;
        }
        .view.active {
            display: block;
        }
        /* Form Styles */
        h2 {
            margin-bottom: 1.5rem;
            font-size: 1.5rem;
            font-weight: 700;
            text-align: center;
            color: var(--text-color);
        }
        .input-group {
            margin-bottom: 1.25rem;
        }
        label {
            display: block;
            margin-bottom: 0.5rem;
            font-size: 0.875rem;
            font-weight: 600;
        }
        input {
            width: 100%;
            padding: 0.75rem;
            border: 1px solid var(--border-color);
            border-radius: 6px;
            font-size: 1rem;
            outline: none;
            transition: border-color 0.2s;
        }
        input:focus {
            border-color: var(--primary-color);
            box-shadow: 0 0 0 3px rgba(37, 99, 235, 0.1);
        }
        button {
            width: 100%;
            padding: 0.75rem;
            background-color: var(--primary-color);
            color: white;
            border: none;
            border-radius: 6px;
            font-size: 1rem;
            font-weight: 600;
            cursor: pointer;
            transition: background-color 0.2s;
        }
        button:hover {
            background-color: var(--primary-hover);
        }
        .error-msg {
            margin-top: 1rem;
            color: var(--error-color);
            font-size: 0.875rem;
            text-align: center;
            min-height: 1.25rem;
        }
        /* Landing / Options Styles */
        .options-list {
            display: flex;
            flex-direction: column;
            gap: 1rem;
            margin-top: 1.5rem;
        }
        .option-btn {
            background-color: #ffffff;
            color: var(--text-color);
            border: 2px solid var(--border-color);
            padding: 1rem;
            font-size: 1rem;
            font-weight: 600;
            border-radius: 8px;
            cursor: pointer;
            transition: all 0.2s;
            text-align: center;
        }
        .option-btn:hover {
            border-color: var(--primary-color);
            color: var(--primary-color);
            background-color: #f1f5f9;
        }
        .back-container {
            margin-top: 1.5rem;
            text-align: center;
        }
        .back-btn, .logout-btn {
            background-color: transparent;
            color: #64748b;
            border: 1px solid var(--border-color);
            width: auto;
            padding: 0.5rem 1rem;
            font-size: 0.875rem;
        }
        .back-btn:hover, .logout-btn:hover {
            background-color: #f1f5f9;
            color: var(--text-color);
        }
        .logout-container {
            margin-top: 2rem;
            text-align: center;
        }
        .logout-btn {
            color: var(--error-color);
            border-color: var(--error-color);
        }
        .logout-btn:hover {
            background-color: var(--error-color);
            color: white;
        }
    </style>
</head>
<body>
    <div class="container">
        <!-- Main Login View -->
        <div id="loginView" class="view active">
            <h2>System Login</h2>
            <form id="loginForm" onsubmit="handleLogin(event)">
                <div class="input-group">
                    <label for="username">Username</label>
                    <input type="text" id="username" required autocomplete="username">
                </div>
                <div class="input-group">
                    <label for="password">Password</label>
                    <input type="password" id="password" required autocomplete="current-password">
                </div>
                <button type="submit">Log In</button>
                <div id="errorMsg" class="error-msg"></div>
            </form>
        </div>
        <!-- Landing Page View (Tire vs All Other Inventory) -->
        <div id="landingView" class="view">
            <h2>Select Inventory</h2>
            <p style="text-align: center; color: #64748b; font-size: 0.9rem; margin-bottom: 1rem;">Choose an inventory system to access:</p>
            <div class="options-list">
                <button class="option-btn" onclick="startSubLogin('Tire Inventory')">Tire Inventory</button>
                <button class="option-btn" onclick="startSubLogin('All Other Inventory')">All Other Inventory</button>
            </div>
            <div class="logout-container">
                <button class="logout-btn" onclick="handleLogout()">Log Out</button>
            </div>
        </div>
        <!-- Sub-Login View (For Tire / All Other Inventory) -->
        <div id="subLoginView" class="view">
            <h2 id="subLoginTitle">Inventory Login</h2>
            <form id="subLoginForm" onsubmit="handleSubLogin(event)">
                <div class="input-group">
                    <label for="subUsername">Username</label>
                    <input type="text" id="subUsername" required autocomplete="username">
                </div>
                <div class="input-group">
                    <label for="subPassword">Password</label>
                    <input type="password" id="subPassword" required autocomplete="current-password">
                </div>
                <button type="submit">Log In</button>
                <div id="subErrorMsg" class="error-msg"></div>
            </form>
            <div class="back-container">
                <button class="back-btn" onclick="switchView('landingView')">Back to Selection</button>
            </div>
        </div>
        <!-- Main Inventory Page View (Buffalo vs Rochester) -->
        <div id="mainInventoryView" class="view">
            <h2 id="inventoryTitle">Main Inventory</h2>
            <p style="text-align: center; color: #64748b; font-size: 0.9rem; margin-bottom: 1rem;">Select a location:</p>
            <div class="options-list">
                <button class="option-btn" onclick="selectLocation('Buffalo')">Buffalo</button>
                <button class="option-btn" onclick="selectLocation('Rochester')">Rochester</button>
            </div>
            <div class="back-container">
                <button class="back-btn" onclick="switchView('landingView')">Back to Inventory Selection</button>
            </div>
        </div>
    </div>
    <script>
        // Credentials
        const ADMIN_USER = "mfsadmin";
        const ADMIN_PASS = "mfs@Harlem!";
        const JEFF_USER = "Jeff Barton";
        const JEFF_PASS = "10@ilShelby";
        let activeInventoryType = "";
        function handleLogin(event) {
            event.preventDefault();
            
            const userInput = document.getElementById("username").value;
            const passInput = document.getElementById("password").value;
            const errorMsg = document.getElementById("errorMsg");
            if (userInput === ADMIN_USER && passInput === ADMIN_PASS) {
                errorMsg.textContent = "";
                document.getElementById("loginForm").reset();
                switchView("landingView");
            } else {
                errorMsg.textContent = "Invalid username or password.";
            }
        }
        function startSubLogin(inventoryName) {
            activeInventoryType = inventoryName;
            document.getElementById("subLoginTitle").textContent = `${inventoryName} Login`;
            document.getElementById("subLoginForm").reset();
            document.getElementById("subErrorMsg").textContent = "";
            switchView("subLoginView");
        }
        function handleSubLogin(event) {
            event.preventDefault();
            const userInput = document.getElementById("subUsername").value;
            const passInput = document.getElementById("subPassword").value;
            const errorMsg = document.getElementById("subErrorMsg");
            // Allows either mfsadmin or Jeff Barton to log into the sub inventories
            if ((userInput === ADMIN_USER && passInput === ADMIN_PASS) || 
                (userInput === JEFF_USER && passInput === JEFF_PASS)) {
                errorMsg.textContent = "";
                document.getElementById("subLoginForm").reset();
                
                // Take them to the main Inventory page with Buffalo/Rochester options
                document.getElementById("inventoryTitle").textContent = `${activeInventoryType} - Location`;
                switchView("mainInventoryView");
            } else {
                errorMsg.textContent = "Invalid username or password.";
            }
        }
        function selectLocation(locationName) {
            alert(`Accessing ${locationName} for ${activeInventoryType}! (Hook up your dashboard route here)`);
        }
        function handleLogout() {
            switchView("loginView");
        }
        function switchView(viewId) {
            document.querySelectorAll(".view").forEach(view => {
                view.classList.remove("active");
            });
            document.getElementById(viewId).classList.add("active");
        }
    </script>
</body>
</html>
