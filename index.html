<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MFS Inventory System - Login</title>
    <style>
        :root {
            --primary-color: #2563eb;
            --primary-hover: #1d4ed8;
            --bg-color: #f8fafc;
            --card-bg: #ffffff;
            --text-color: #1e293b;
            --border-color: #cbd5e1;
            --error-color: #ef4444;
        }
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
        }
        body {
            background-color: var(--bg-color);
            color: var(--text-color);
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
        }
        .container {
            width: 100%;
            max-width: 400px;
            padding: 2rem;
            background-color: var(--card-bg);
            border-radius: 12px;
            box-shadow: 0 4px 6px -1px rgb(0 0 0 / 0.1), 0 2px 4px -2px rgb(0 0 0 / 0.1);
        }
        /* View States */
        .view {
            display: none;
        }
        .view.active {
            display: block;
        }
        /* Form Styles */
        h2 {
            margin-bottom: 1.5rem;
            font-size: 1.5rem;
            font-weight: 700;
            text-align: center;
            color: var(--text-color);
        }
        .input-group {
            margin-bottom: 1.25rem;
        }
        label {
            display: block;
            margin-bottom: 0.5rem;
            font-size: 0.875rem;
            font-weight: 600;
        }
        input {
            width: 100%;
            padding: 0.75rem;
            border: 1px solid var(--border-color);
            border-radius: 6px;
            font-size: 1rem;
            outline: none;
            transition: border-color 0.2s;
        }
        input:focus {
            border-color: var(--primary-color);
            box-shadow: 0 0 0 3px rgba(37, 99, 235, 0.1);
        }
        button {
            width: 100%;
            padding: 0.75rem;
            background-color: var(--primary-color);
            color: white;
            border: none;
            border-radius: 6px;
            font-size: 1rem;
            font-weight: 600;
            cursor: pointer;
            transition: background-color 0.2s;
        }
        button:hover {
            background-color: var(--primary-hover);
        }
        .error-msg {
            margin-top: 1rem;
            color: var(--error-color);
            font-size: 0.875rem;
            text-align: center;
            min-height: 1.25rem;
        }
        /* Landing Page Styles */
        .landing-options {
            display: flex;
            flex-direction: column;
            gap: 1rem;
            margin-top: 1.5rem;
        }
        .inventory-btn {
            background-color: #ffffff;
            color: var(--text-color);
            border: 2px solid var(--border-color);
            padding: 1rem;
            font-size: 1rem;
            font-weight: 600;
            border-radius: 8px;
            cursor: pointer;
            transition: all 0.2s;
            text-align: center;
        }
        .inventory-btn:hover {
            border-color: var(--primary-color);
            color: var(--primary-color);
            background-color: #f1f5f9;
        }
        .logout-container {
            margin-top: 2rem;
            text-align: center;
        }
        .logout-btn {
            background-color: transparent;
            color: var(--error-color);
            border: 1px solid var(--error-color);
            width: auto;
            padding: 0.5rem 1rem;
            font-size: 0.875rem;
        }
        .logout-btn:hover {
            background-color: var(--error-color);
            color: white;
        }
    </style>
</head>
<body>
    <div class="container">
        <!-- Login View -->
        <div id="loginView" class="view active">
            <h2>System Login</h2>
            <form id="loginForm" onsubmit="handleLogin(event)">
                <div class="input-group">
                    <label for="username">Username</label>
                    <input type="text" id="username" required autocomplete="username">
                </div>
                <div class="input-group">
                    <label for="password">Password</label>
                    <input type="password" id="password" required autocomplete="current-password">
                </div>
                <button type="submit">Log In</button>
                <div id="errorMsg" class="error-msg"></div>
            </form>
        </div>
        <!-- Landing Page View -->
        <div id="landingView" class="view">
            <h2>Select Inventory</h2>
            <p style="text-align: center; color: #64748b; font-size: 0.9rem; margin-bottom: 1rem;">Choose an inventory system to manage:</p>
            <div class="landing-options">
                <button class="inventory-btn" onclick="navigateTo('Tire Inventory')">Tire Inventory</button>
                <button class="inventory-btn" onclick="navigateTo('All Other Inventory')">All Other Inventory</button>
            </div>
            <div class="logout-container">
                <button class="logout-btn" onclick="handleLogout()">Log Out</button>
            </div>
        </div>
    </div>
    <script>
        // Authentication Credentials
        const VALID_USER = "mfsadmin";
        const VALID_PASS = "mfs@Harlem!";
        function handleLogin(event) {
            event.preventDefault();
            
            const userInput = document.getElementById("username").value;
            const passInput = document.getElementById("password").value;
            const errorMsg = document.getElementById("errorMsg");
            if (userInput === VALID_USER && passInput === VALID_PASS) {
                errorMsg.textContent = "";
                document.getElementById("loginForm").reset();
                switchView("landingView");
            } else {
                errorMsg.textContent = "Invalid username or password.";
            }
        }
        function handleLogout() {
            switchView("loginView");
        }
        function switchView(viewId) {
            document.querySelectorAll(".view").forEach(view => {
                view.classList.remove("active");
            });
            document.getElementById(viewId).classList.add("active");
        }
        function navigateTo(section) {
            alert(`Navigating to: ${section} (Hook up your specific dashboard or database route here!)`);
        }
    </script>
</body>
</html>
